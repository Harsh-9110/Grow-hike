[project]
name = "grow-hike-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy>=2.0.38,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "redis>=5.2,<7", "pgvector>=0.3,<1",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3",
  "bcrypt>=4.2,<5", "PyJWT[crypto]>=2.10,<3", "cryptography>=44,<47",
  "httpx>=0.28,<1", "APScheduler>=3.11,<4", "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1", "numpy>=2.1,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "fakeredis[lua]>=2.28,<3", "pytest-cov>=6,<8"]
ml = ["torch>=2.6,<3"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires real PostgreSQL and Redis", "ml: requires PyTorch"]
